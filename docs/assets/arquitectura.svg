<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Arquitectura del visor web de la Ruta 5</title>
  <desc id="d">Sitio estático: GitHub Actions publica el repositorio en GitHub Pages, que entrega archivos al navegador. Todo el cálculo ocurre en el navegador. QGIS es la referencia de verificación.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Visor Ruta 5: sitio estático, cálculo en el navegador</text>

  <!-- Repositorio -->
  <rect x="30" y="70" width="210" height="300" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="135" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Repositorio GitHub</text>
  <rect x="48" y="115" width="174" height="44" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="135" y="142" text-anchor="middle" font-size="13" fill="#1e293b">site/ (HTML, JS, CSS)</text>
  <rect x="48" y="171" width="174" height="44" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="135" y="198" text-anchor="middle" font-size="13" fill="#1e293b">data/ (GeoJSON, GeoTIFF)</text>
  <rect x="48" y="227" width="174" height="44" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="135" y="254" text-anchor="middle" font-size="13" fill="#1e293b">participantes/&lt;nombre&gt;/</text>
  <rect x="48" y="283" width="174" height="44" rx="6" fill="#fff" stroke="#a5b4fc"/>
  <text x="135" y="310" text-anchor="middle" font-size="13" fill="#1e293b">docs/ (método SDD)</text>
  <text x="135" y="354" text-anchor="middle" font-size="12" fill="#4338ca">ramas: master · develop</text>

  <!-- Publicación -->
  <rect x="300" y="70" width="190" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="395" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">GitHub Actions</text>
  <text x="395" y="124" text-anchor="middle" font-size="13" fill="#1e293b">Al integrar en master</text>
  <text x="395" y="144" text-anchor="middle" font-size="13" fill="#1e293b">construye y publica</text>
  <text x="395" y="170" text-anchor="middle" font-size="12" fill="#047857">sin servidor propio</text>

  <rect x="300" y="240" width="190" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="395" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">GitHub Pages</text>
  <text x="395" y="294" text-anchor="middle" font-size="13" fill="#1e293b">Entrega archivos</text>
  <text x="395" y="314" text-anchor="middle" font-size="13" fill="#1e293b">estáticos por HTTPS</text>
  <text x="395" y="340" text-anchor="middle" font-size="12" fill="#047857">no ejecuta código</text>

  <!-- Navegador -->
  <rect x="550" y="70" width="380" height="300" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="740" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Navegador de cada persona</text>
  <rect x="568" y="115" width="344" height="42" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="740" y="141" text-anchor="middle" font-size="13" fill="#1e293b">Leaflet 1.9.4 + markercluster 1.5.3</text>
  <rect x="568" y="167" width="344" height="42" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="740" y="193" text-anchor="middle" font-size="13" fill="#1e293b">georaster-layer-for-leaflet 4.1.2 (dibuja el ráster)</text>
  <rect x="568" y="219" width="344" height="42" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="740" y="245" text-anchor="middle" font-size="13" fill="#1e293b">GeoBlaze 2.8.0 (altura, pendiente) + proj4 2.22.0</text>
  <rect x="568" y="271" width="344" height="42" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="740" y="297" text-anchor="middle" font-size="13" fill="#1e293b">Leaflet-Geoman (dibujo de áreas)</text>
  <text x="740" y="346" text-anchor="middle" font-size="12" fill="#c2410c">Todo el cálculo ocurre aquí (R-02)</text>

  <!-- Mapas base -->
  <rect x="550" y="410" width="380" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="740" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Mapas base externos</text>
  <text x="740" y="464" text-anchor="middle" font-size="13" fill="#1e293b">Esri oscuro · Esri satélite · OpenStreetMap</text>

  <!-- QGIS -->
  <rect x="30" y="410" width="460" height="80" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="260" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">QGIS (referencia de verificación)</text>
  <text x="260" y="464" text-anchor="middle" font-size="13" fill="#1e293b">Se compara cada resultado del visor contra QGIS, no contra la IA</text>

  <!-- Flechas -->
  <line x1="240" y1="135" x2="298" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="395" y1="200" x2="395" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="305" x2="548" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="519" y="296" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>
  <line x1="740" y1="372" x2="740" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="790" y="394" text-anchor="middle" font-size="11" fill="#475569">teselas</text>
  <line x1="135" y1="372" x2="135" y2="408" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="185" y="394" text-anchor="middle" font-size="11" fill="#475569">datos de control</text>
</svg>
